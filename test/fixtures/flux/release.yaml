apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: web
  namespace: apps
spec:
  interval: 10m
  targetNamespace: web
  chart:
    spec:
      chart: ./charts/app
      sourceRef:
        kind: GitRepository
        name: fixtures
        namespace: flux-system
      valuesFiles:
        - charts/app/values.yaml
        - charts/app/values-base.yaml
  valuesFrom:
    - kind: ConfigMap
      name: web-values
      valuesKey: tag
      targetPath: image.tag
    - kind: ConfigMap
      name: web-values
    - kind: Secret
      name: web-secret
      valuesKey: ttl
      targetPath: cache.ttl
    - kind: ConfigMap
      name: web-env
      valuesKey: env.yaml
  values:
    replicas: 6
    image:
      tag: "6.0"
    podAnnotations:
      team: web
