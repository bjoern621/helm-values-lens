apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: services
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - git:
        repoURL: https://example.com/fixtures.git
        revision: HEAD
        directories:
          - path: appset/services/*
          - path: appset/services/legacy
            exclude: true
  template:
    metadata:
      name: "{{ .path.basename }}"
    spec:
      project: default
      destination:
        namespace: '{{ index .path.segments 1 }}'
      sources:
        - repoURL: https://example.com/fixtures.git
          path: charts/app
          helm:
            releaseName: "svc-{{.path.basenameNormalized}}"
            valueFiles:
              - $values/{{.path.path}}/values.yaml
            valuesObject:
              podAnnotations:
                service: "{{ .path.basename }}"
        - repoURL: https://example.com/fixtures.git
          ref: values
