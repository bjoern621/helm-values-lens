apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform
  namespace: argocd
spec:
  destination:
    namespace: argocd
  source:
    repoURL: https://git.example.com/acme/gitops.git
    path: charts/platform
    helm:
      valuesObject:
        cluster:
          name: staging
          domain: staging.example.com
